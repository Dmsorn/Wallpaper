<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WALLPAPER_VAULT.EXE</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0221;
      --main-color: #00ffcc;
      --accent-color: #ff007f;
      --card-bg: #190a38;
      --card-footer: #120529;
      --text-color: #00ffcc;
    }

    body.theme-matrix {
      --bg-color: #050b05;
      --main-color: #00ff66;
      --accent-color: #00ff66;
      --card-bg: #0a1a0a;
      --card-footer: #020a02;
      --text-color: #00ff66;
    }

    body.theme-amber {
      --bg-color: #0f0a00;
      --main-color: #ffb000;
      --accent-color: #ff8800;
      --card-bg: #1f1400;
      --card-footer: #0a0600;
      --text-color: #ffb000;
    }

    body.theme-gameboy {
      --bg-color: #8b956d;
      --main-color: #0f380f;
      --accent-color: #306230;
      --card-bg: #9bbc0f;
      --card-footer: #8b956d;
      --text-color: #0f380f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'VT323', monospace;
      padding: 1.5rem 1rem;
      font-size: 1.25rem;
      letter-spacing: 1px;
      transition: background-color 0.3s ease, color 0.3s ease;
      cursor: crosshair;
    }

    /* CRT Scanline Overlay */
    .crt-overlay {
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }
    .crt-overlay.disabled { display: none; }

    .container { max-width: 1300px; margin: 0 auto; }

    /* Glitch Title Animation */
    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.4rem;
      text-align: center;
      color: var(--accent-color);
      text-shadow: 3px 3px var(--main-color);
      margin-bottom: 1.2rem;
      line-height: 1.5;
      animation: glitch 2s infinite alternate;
    }

    @keyframes glitch {
      0% { text-shadow: 3px 3px var(--main-color); }
      50% { text-shadow: -2px 2px var(--accent-color), 2px -2px var(--main-color); }
      100% { text-shadow: 3px 3px var(--main-color); }
    }

    /* Retro Toolbar & Search */
    .toolbar, .search-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .retro-input {
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.4rem 0.8rem;
      box-shadow: 3px 3px 0px var(--accent-color);
      outline: none;
      width: 100%;
      max-width: 400px;
    }
    .retro-input::placeholder { color: var(--text-color); opacity: 0.6; }

    .retro-select, .retro-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.5rem 0.7rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--accent-color);
      outline: none;
    }

    .retro-btn:hover, .retro-select:hover {
      background: var(--accent-color);
      color: #fff;
      border-color: #fff;
    }

    /* Category Filter Buttons */
    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin-bottom: 1.5rem; }
    .filter-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--accent-color);
      transition: all 0.1s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: #fff;
      box-shadow: 3px 3px 0px var(--main-color);
      transform: translate(-1px, -1px);
    }

    /* Gallery Grid & Density Toggle */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .gallery.compact {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    /* Retro Window Cards */
    .card {
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      box-shadow: 4px 4px 0px var(--main-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .card-header {
      background: var(--accent-color);
      color: #ffffff;
      padding: 0.2rem 0.5rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-img-wrap {
      cursor: pointer;
      overflow: hidden;
      border-bottom: 2px solid var(--accent-color);
      height: 200px;
      background: #000;
      position: relative;
    }
    .gallery.compact .card-img-wrap { height: 140px; }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .card:hover img { transform: scale(1.05); }

    /* Aspect Ratio Badges */
    .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--bg-color);
      color: var(--main-color);
      border: 1px solid var(--main-color);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.45rem;
      padding: 2px 4px;
      z-index: 2;
    }

    .card-footer {
      padding: 0.4rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-footer);
    }
    .card-footer span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 110px;
      color: var(--text-color);
    }

    .fav-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 1.1rem;
      cursor: pointer;
      margin-right: 4px;
    }
    .fav-btn.active { color: #ff0055; text-shadow: 0 0 5px #ff0055; }

    /* Fullscreen Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 3px solid var(--main-color);
      box-shadow: 8px 8px 0px var(--accent-color);
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      background: var(--main-color);
      color: var(--bg-color);
      padding: 0.4rem 0.8rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-actions { display: flex; gap: 0.8rem; align-items: center; }
    .modal-btn {
      cursor: pointer;
      font-weight: bold;
      color: var(--accent-color);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
    }
    .modal-body img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="crt-overlay" id="crtOverlay"></div>

  <div class="container">
    <h1>> WALLPAPER_VAULT.EXE</h1>

    <div class="search-container">
      <input type="text" id="searchInput" class="retro-input" placeholder="> SEARCH_FILE_OR_FOLDER..." oninput="handleSearch()">
    </div>

    <div class="toolbar">
      <button class="retro-btn" onclick="surpriseMe()">[SURPRISE_ME.EXE]</button>
      <button class="retro-btn" onclick="toggleCRT()" id="crtBtn">[CRT: ON]</button>
      <button class="retro-btn" onclick="toggleSFX()" id="sfxBtn">[SFX: OFF]</button>
      <button class="retro-btn" onclick="toggleDensity()" id="densityBtn">[VIEW: 2X]</button>
      
      <select class="retro-select" onchange="changeSort(this.value)">
        <option value="az">SORT: A-Z</option>
        <option value="za">SORT: Z-A</option>
        <option value="random">SORT: RANDOM</option>
      </select>

      <select class="retro-select" id="themeSelect" onchange="changeTheme(this.value)">
        <option value="theme-synthwave">THEME: SYNTHWAVE</option>
        <option value="theme-matrix">THEME: MATRIX</option>
        <option value="theme-amber">THEME: AMBER</option>
        <option value="theme-gameboy">THEME: GAMEBOY</option>
      </select>
    </div>

    <div class="filters" id="filters"></div>
    <div class="gallery" id="gallery">LOADING_DATA...</div>
  </div>

  <div class="modal" id="previewModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalTitle">PREVIEW.BMP</span>
        <div class="modal-actions">
          <span class="modal-btn" id="modalDLBtn">[GET]</span>
          <span class="modal-btn" onclick="closeModal()">[X]</span>
        </div>
      </div>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Wallpaper Preview">
      </div>
    </div>
  </div>

  <script>
    const USERNAME = 'Dmsorn';
    const REPO = 'Wallpaper';

    let allWallpapers = [];
    let currentCategory = 'All';
    let searchQuery = '';
    let currentSort = 'az';
    let favorites = JSON.parse(localStorage.getItem('vault_favs') || '[]');

    // Global Settings State (Persisted in localStorage)
    let settings = JSON.parse(localStorage.getItem('vault_settings')) || {
      theme: 'theme-synthwave',
      crt: true,
      sfx: false,
      density: 'normal'
    };

    let sfxEnabled = settings.sfx;
    let audioCtx = null;

    /* Initialize Saved Settings across page reloads */
    function initSettings() {
      // 1. Restore Theme
      document.body.className = settings.theme;
      const themeSelect = document.getElementById('themeSelect');
      if (themeSelect) themeSelect.value = settings.theme;

      // 2. Restore CRT Overlay
      const crtOverlay = document.getElementById('crtOverlay');
      const crtBtn = document.getElementById('crtBtn');
      if (!settings.crt) {
        crtOverlay.classList.add('disabled');
        if (crtBtn) crtBtn.innerText = '[CRT: OFF]';
      } else {
        crtOverlay.classList.remove('disabled');
        if (crtBtn) crtBtn.innerText = '[CRT: ON]';
      }

      // 3. Restore SFX State
      sfxEnabled = settings.sfx;
      const sfxBtn = document.getElementById('sfxBtn');
      if (sfxBtn) sfxBtn.innerText = sfxEnabled ? '[SFX: ON]' : '[SFX: OFF]';

      // 4. Restore Grid Density
      const gallery = document.getElementById('gallery');
      const densityBtn = document.getElementById('densityBtn');
      if (settings.density === 'compact') {
        gallery.classList.add('compact');
        if (densityBtn) densityBtn.innerText = '[VIEW: 4X]';
      } else {
        gallery.classList.remove('compact');
        if (densityBtn) densityBtn.innerText = '[VIEW: 2X]';
      }
    }

    function saveSettings() {
      localStorage.setItem('vault_settings', JSON.stringify(settings));
    }

    /* Lazy Audio Context Initialization */
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    /* Multi-Tone 8-Bit SFX Engine */
    function playSFX(type) {
      if (!sfxEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      switch (type) {
        case 'coin': // Favorite button chime (2-tone rising chime)
          osc.type = 'square';
          osc.frequency.setValueAtTime(987.77, now); // B5
          osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
          break;

        case 'powerup': // Surprise Me / Turn SFX On (Pitch sweep)
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
          break;

        case 'click': // Standard UI click / filter switch
          osc.type = 'square';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
          break;

        case 'close': // Closing modal / back action (Falling pitch)
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
          break;
      }
    }

    async function initGallery() {
      const gallery = document.getElementById('gallery');

      try {
        const repoRes = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}`);
        if (!repoRes.ok) throw new Error('REPO_NOT_FOUND');
        const repoData = await repoRes.json();
        const BRANCH = repoData.default_branch;

        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
        if (!res.ok) throw new Error('TREE_FETCH_FAILED');
        const data = await res.json();

        const imageFiles = data.tree.filter(item => 
          item.type === 'blob' && item.path.match(/\.(jpg|jpeg|png|webp|gif)$/i)
        );

        const categories = new Set(['All', 'FAVORITES']);

        allWallpapers = imageFiles.map(file => {
          const parts = file.path.split('/');
          const filename = parts.pop();
          const category = parts.length > 0 ? parts[0] : 'Root';
          
          categories.add(category);

          const safePath = file.path.split('/').map(encodeURIComponent).join('/');
          const fullUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${safePath}`;
          const thumbUrl = `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=400&output=webp&q=75`;

          return {
            name: filename,
            category: category,
            url: fullUrl,
            thumbUrl: thumbUrl
          };
        });

        renderFilters(Array.from(categories));
        renderGallery();

        // Check URL Hash Direct Links
        checkHashLink();

      } catch (err) {
        gallery.innerHTML = `<p style="color:var(--accent-color); text-align:center; grid-column: 1/-1;">[ERROR]: ${err.message}. VERIFY PUBLIC REPO STATUS.</p>`;
      }
    }

    function renderFilters(categories) {
      const filters = document.getElementById('filters');
      filters.innerHTML = categories.map((cat, idx) => `
        <button class="filter-btn ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">[${cat}]</button>
      `).join('');
    }

    function getFilteredList() {
      let list = [...allWallpapers];

      if (currentCategory === 'FAVORITES') {
        list = list.filter(w => favorites.includes(w.name));
      } else if (currentCategory !== 'All') {
        list = list.filter(w => w.category === currentCategory);
      }

      // Enhanced Search: Checks Filename AND Category/Folder
      if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase();
        list = list.filter(w => 
          w.name.toLowerCase().includes(query) || 
          w.category.toLowerCase().includes(query)
        );
      }

      if (currentSort === 'az') list.sort((a, b) => a.name.localeCompare(b.name));
      if (currentSort === 'za') list.sort((a, b) => b.name.localeCompare(a.name));
      if (currentSort === 'random') list.sort(() => Math.random() - 0.5);

      return list;
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const filtered = getFilteredList();

      if (filtered.length === 0) {
        gallery.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">NO_FILES_FOUND.</p>`;
        return;
      }

      gallery.innerHTML = filtered.map(item => {
        const isFav = favorites.includes(item.name);
        return `
          <div class="card">
            <div class="card-header">
              <span>SYS_IMG</span>
              <span>OK</span>
            </div>
            <div class="card-img-wrap" onclick="openModal('${item.url}', '${item.name}')">
              <span class="badge" id="badge-${item.name.replace(/[^a-zA-Z0-9]/g, '')}">IMG</span>
              <img src="${item.thumbUrl}" alt="${item.name}" loading="lazy" onload="detectOrientation(this, 'badge-${item.name.replace(/[^a-zA-Z0-9]/g, '')}')">
            </div>
            <div class="card-footer">
              <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${item.name}', event)">${isFav ? '♥' : '♡'}</button>
              <span>${item.name}</span>
              <button class="retro-btn" onclick="downloadImage('${item.url}', '${item.name}')">GET</button>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Orientation Badge Detector */
    function detectOrientation(img, badgeId) {
      const badge = document.getElementById(badgeId);
      if (!badge) return;
      if (img.naturalWidth > img.naturalHeight) {
        badge.innerText = 'DESKTOP';
      } else {
        badge.innerText = 'MOBILE';
      }
    }

    /* Favorites System */
    function toggleFav(name, event) {
      event.stopPropagation();
      playSFX('coin');
      if (favorites.includes(name)) {
        favorites = favorites.filter(f => f !== name);
      } else {
        favorites.push(name);
      }
      localStorage.setItem('vault_favs', JSON.stringify(favorites));
      renderGallery();
    }

    /* Search Input Handler */
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      renderGallery();
    }

    /* Category Filter Handler */
    function filterCategory(category, btn) {
      playSFX('click');
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGallery();
    }

    /* Surprise Randomizer */
    function surpriseMe() {
      playSFX('powerup');
      if (allWallpapers.length === 0) return;
      const rand = allWallpapers[Math.floor(Math.random() * allWallpapers.length)];
      openModal(rand.url, rand.name);
    }

    /* Direct Blob Download */
    async function downloadImage(url, filename) {
      playSFX('click');
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
      }
    }

    /* Modal & Hash Deep Linking */
    function openModal(url, title) {
      playSFX('click');
      document.getElementById('modalImg').src = url;
      document.getElementById('modalTitle').innerText = title;
      
      const dlBtn = document.getElementById('modalDLBtn');
      dlBtn.onclick = () => downloadImage(url, title);
      
      document.getElementById('previewModal').classList.add('active');
      window.location.hash = `preview=${encodeURIComponent(title)}`;
    }

    function closeModal() {
      playSFX('close');
      document.getElementById('previewModal').classList.remove('active');
      history.replaceState(null, null, ' ');
    }

    function checkHashLink() {
      if (window.location.hash.startsWith('#preview=')) {
        const title = decodeURIComponent(window.location.hash.replace('#preview=', ''));
        const item = allWallpapers.find(w => w.name === title);
        if (item) openModal(item.url, item.name);
      }
    }

    /* Controls & State-Saving Toggles */
    function toggleCRT() {
      playSFX('click');
      const overlay = document.getElementById('crtOverlay');
      const btn = document.getElementById('crtBtn');
      overlay.classList.toggle('disabled');
      
      settings.crt = !overlay.classList.contains('disabled');
      btn.innerText = settings.crt ? '[CRT: ON]' : '[CRT: OFF]';
      saveSettings();
    }

    function toggleSFX() {
      sfxEnabled = !sfxEnabled;
      settings.sfx = sfxEnabled;
      if (sfxEnabled) {
        initAudio();
        playSFX('powerup');
      }
      document.getElementById('sfxBtn').innerText = sfxEnabled ? '[SFX: ON]' : '[SFX: OFF]';
      saveSettings();
    }

    function toggleDensity() {
      playSFX('click');
      const gallery = document.getElementById('gallery');
      const btn = document.getElementById('densityBtn');
      gallery.classList.toggle('compact');
      
      const isCompact = gallery.classList.contains('compact');
      settings.density = isCompact ? 'compact' : 'normal';
      btn.innerText = isCompact ? '[VIEW: 4X]' : '[VIEW: 2X]';
      saveSettings();
    }

    function changeSort(val) {
      playSFX('click');
      currentSort = val;
      renderGallery();
    }

    function changeTheme(themeName) {
      playSFX('click');
      document.body.className = themeName;
      settings.theme = themeName;
      saveSettings();
    }

    // Initialize state and load gallery on page boot
    initSettings();
    initGallery();
  </script>
</body>
</html>
