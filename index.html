<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WALLPAPER_VAULT.EXE</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0221;
      --main-color: #00ffcc;
      --accent-color: #ff007f;
      --card-bg: #190a38;
      --card-footer: #120529;
      --text-color: #00ffcc;
    }

    body.theme-matrix {
      --bg-color: #050b05;
      --main-color: #00ff66;
      --accent-color: #00ff66;
      --card-bg: #0a1a0a;
      --card-footer: #020a02;
      --text-color: #00ff66;
    }

    body.theme-amber {
      --bg-color: #0f0a00;
      --main-color: #ffb000;
      --accent-color: #ff8800;
      --card-bg: #1f1400;
      --card-footer: #0a0600;
      --text-color: #ffb000;
    }

    body.theme-gameboy {
      --bg-color: #8b956d;
      --main-color: #0f380f;
      --accent-color: #306230;
      --card-bg: #9bbc0f;
      --card-footer: #8b956d;
      --text-color: #0f380f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'VT323', monospace;
      padding: 1.5rem 1rem;
      font-size: 1.25rem;
      letter-spacing: 1px;
      transition: background-color 0.3s ease, color 0.3s ease;
      cursor: crosshair;
    }

    /* CRT Scanline Overlay */
    .crt-overlay {
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }
    .crt-overlay.disabled { display: none; }

    .container { max-width: 1300px; margin: 0 auto; }

    /* Glitch Title Animation */
    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.4rem;
      text-align: center;
      color: var(--accent-color);
      text-shadow: 3px 3px var(--main-color);
      margin-bottom: 1.2rem;
      line-height: 1.5;
      animation: glitch 2s infinite alternate;
    }

    @keyframes glitch {
      0% { text-shadow: 3px 3px var(--main-color); }
      50% { text-shadow: -2px 2px var(--accent-color), 2px -2px var(--main-color); }
      100% { text-shadow: 3px 3px var(--main-color); }
    }

    /* Retro Toolbar & Search */
    .toolbar, .search-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .retro-input {
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.4rem 0.8rem;
      box-shadow: 3px 3px 0px var(--accent-color);
      outline: none;
      width: 100%;
      max-width: 400px;
    }
    .retro-input::placeholder { color: var(--text-color); opacity: 0.6; }

    .retro-select, .retro-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.5rem 0.7rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--accent-color);
      outline: none;
    }

    .retro-btn:hover, .retro-select:hover {
      background: var(--accent-color);
      color: #fff;
      border-color: #fff;
    }

    /* Category Filter Buttons */
    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin-bottom: 1.5rem; }
    .filter-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--accent-color);
      transition: all 0.1s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: #fff;
      box-shadow: 3px 3px 0px var(--main-color);
      transform: translate(-1px, -1px);
    }

    /* Gallery Grid & Density Toggle */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .gallery.compact {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    /* Retro Window Cards */
    .card {
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      box-shadow: 4px 4px 0px var(--main-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .card-header {
      background: var(--accent-color);
      color: #ffffff;
      padding: 0.2rem 0.5rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-img-wrap {
      cursor: pointer;
      overflow: hidden;
      border-bottom: 2px solid var(--accent-color);
      height: 200px;
      background: #000;
      position: relative;
    }
    .gallery.compact .card-img-wrap { height: 140px; }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .card:hover img { transform: scale(1.05); }

    /* Metadata Badges & Auto Vibe Badges */
    .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--bg-color);
      color: var(--main-color);
      border: 1px solid var(--main-color);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.4rem;
      padding: 3px 5px;
      z-index: 2;
    }

    .vibe-badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.38rem;
      padding: 2px 4px;
      z-index: 2;
    }

    .card-footer {
      padding: 0.4rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-footer);
    }
    .card-footer span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 120px;
      color: var(--text-color);
    }

    .fav-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 1.1rem;
      cursor: pointer;
      margin-right: 4px;
    }
    .fav-btn.active { color: #ff0055; text-shadow: 0 0 5px #ff0055; }

    /* Fullscreen Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    
    .modal-content {
      position: relative;
      display: inline-block;
      border: 3px solid var(--main-color);
      box-shadow: 8px 8px 0px var(--accent-color);
      background: #000;
      line-height: 0;
      max-width: 90vw;
      max-height: 90vh;
      overflow: hidden;
    }

    .modal-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      color: var(--main-color);
      border-bottom: 2px solid var(--main-color);
      padding: 0.5rem 0.8rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      line-height: normal;
      overflow: hidden;
    }

    #modalTitle {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-shrink: 0;
    }

    .modal-btn {
      cursor: pointer;
      font-weight: bold;
      color: var(--accent-color);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
    }
    .modal-btn:hover { color: #fff; }

    .modal-body {
      display: inline-block;
      position: relative;
    }
    
    .modal-body img {
      max-width: 90vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* Screensaver Mode */
    .screensaver {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      z-index: 200;
      justify-content: center;
      align-items: center;
      cursor: none;
    }
    .screensaver.active { display: flex; }

    .screensaver-wrapper {
      position: relative;
      display: inline-block;
      max-width: 90vw;
      max-height: 90vh;
      line-height: 0;
    }

    .screensaver-wrapper img {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      animation: fadeIn 0.5s ease-in-out;
    }

    .screensaver-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.5rem;
      color: var(--main-color);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      padding: 8px 14px;
      border: 2px solid var(--accent-color);
      box-shadow: 4px 4px 0px var(--main-color);
      text-align: center;
      white-space: nowrap;
      z-index: 10;
      line-height: normal;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay" id="crtOverlay"></div>

  <div class="container">
    <h1>> WALLPAPER_VAULT.EXE</h1>

    <div class="search-container">
      <input type="text" id="searchInput" class="retro-input" placeholder="> SEARCH_FILE_OR_TAG..." oninput="handleSearch()">
    </div>

    <div class="toolbar">
      <button class="retro-btn" onclick="surpriseMe()">[SURPRISE_ME.EXE]</button>
      <button class="retro-btn" onclick="toggleScreensaver()">[SCREENSAVER.EXE]</button>
      <button class="retro-btn" onclick="toggleCRT()" id="crtBtn">[CRT: ON]</button>
      <button class="retro-btn" onclick="toggleSFX()" id="sfxBtn">[SFX: OFF]</button>

      <select class="retro-select" onchange="changeSort(this.value)">
        <option value="az">SORT: A-Z</option>

        <option value="theme-synthwave">THEME: SYNTHWAVE</option>
        <option value="theme-matrix">THEME: MATRIX</option>

      </select>
    </div>

    <div class="filters" id="filters"></div>
    <div class="gallery" id="gallery">LOADING_DATA...</div>
  </div>

  <div class="modal" id="previewModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalTitle">PREVIEW.BMP</span>
        <div class="modal-actions">
          <span class="modal-btn" onclick="copyShareLink()" id="shareBtn">[SHARE]</span>
          <span class="modal-btn" id="modalDLBtn">[GET]</span>
          <span class="modal-btn" onclick="closeModal()">[X]</span>
        </div>
      </div>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Wallpaper Preview">
      </div>
    </div>
  </div>

  <div class="screensaver" id="screensaverOverlay" onclick="toggleScreensaver()">
    <div class="screensaver-wrapper">
      <img id="screensaverImg" src="" alt="Screensaver Wallpaper">
      <div class="screensaver-info">
        <div id="screensaverTitle">TITLE.BMP</div>
        <div style="font-size: 0.4rem; opacity: 0.6; margin-top: 4px;">[CLICK OR PRESS ANY KEY TO EXIT]</div>
      </div>
    </div>
  </div>

  <script>
    const USERNAME = 'Dmsorn';
    const REPO = 'Wallpaper';

    let allWallpapers = [];
    let currentCategory = 'All';
    let searchQuery = '';
    let currentSort = 'az';
    let favorites = JSON.parse(localStorage.getItem('vault_favs') || '[]');

    let settings = JSON.parse(localStorage.getItem('vault_settings')) || {
      theme: 'theme-synthwave',
      crt: true,
      sfx: false,
      density: 'normal'
    };

    let sfxEnabled = settings.sfx;
    let audioCtx = null;
    let screensaverActive = false;
    let screensaverTimer = null;

    /* Option 1: Smart Retro Name Generator */
    function generateSmartName(originalFilename) {
      const parts = originalFilename.split('.');
      const ext = parts.length > 1 ? parts.pop().toUpperCase() : 'PNG';
      const rawName = parts.join('.');

      // If pure numbers, long random hex strings, or too long (> 12 chars)
      if (/^[0-9_-]+$/.test(rawName) || /^[a-f0-9]{10,}$/i.test(rawName) || rawName.length > 12) {
        let hash = 0;
        for (let i = 0; i < rawName.length; i++) {
          hash = ((hash << 5) - hash) + rawName.charCodeAt(i);
          hash |= 0;
        }
        const shortHex = Math.abs(hash).toString(16).substring(0, 4).toUpperCase();
        return `VAULT_${shortHex}.${ext}`;
      }

      // Clean up punctuation and capitalize
      return rawName.replace(/[-_]/g, ' ').toUpperCase().slice(0, 12) + `.${ext}`;
    }

    /* Option 2: Canvas Color Vibe Tag Detector */
    function detectColorVibe(imgElement) {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 10;
        canvas.height = 10;

        ctx.drawImage(imgElement, 0, 0, 10, 10);
        const data = ctx.getImageData(0, 0, 10, 10).data;

        let r = 0, g = 0, b = 0;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
        }
        const count = data.length / 4;
        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);

        const brightness = (r * 299 + g * 587 + b * 114) / 1000;

        if (brightness < 45) return '#DARK_VOID';
        if (brightness > 200) return '#LIGHT_CORE';
        if (r > g + 30 && r > b + 30) return '#NEON_RED';
        if (g > r + 30 && g > b + 30) return '#MATRIX_GREEN';
        if (b > r + 30 && b > g + 30) return '#CYAN_NEON';
        if (r > 130 && b > 130 && g < 100) return '#PURPLE_HAZE';
        if (r > 150 && g > 110 && b < 90) return '#AMBER_GLOW';

        return '#RETRO_VIBE';
      } catch (e) {
        return '#RETRO_VIBE';
      }
    }

    function initSettings() {
      document.body.className = settings.theme;
      const themeSelect = document.getElementById('themeSelect');
      if (themeSelect) themeSelect.value = settings.theme;

      const crtOverlay = document.getElementById('crtOverlay');
      const crtBtn = document.getElementById('crtBtn');
      if (!settings.crt) {
        crtOverlay.classList.add('disabled');
        if (crtBtn) crtBtn.innerText = '[CRT: OFF]';
      } else {
        crtOverlay.classList.remove('disabled');
        if (crtBtn) crtBtn.innerText = '[CRT: ON]';
      }

      sfxEnabled = settings.sfx;
      const sfxBtn = document.getElementById('sfxBtn');
      if (sfxBtn) sfxBtn.innerText = sfxEnabled ? '[SFX: ON]' : '[SFX: OFF]';

      const gallery = document.getElementById('gallery');
      const densityBtn = document.getElementById('densityBtn');
      if (settings.density === 'compact') {
        gallery.classList.add('compact');
        if (densityBtn) densityBtn.innerText = '[VIEW: 4X]';
      } else {
        gallery.classList.remove('compact');
        if (densityBtn) densityBtn.innerText = '[VIEW: 2X]';
      }
    }

    function saveSettings() {
      localStorage.setItem('vault_settings', JSON.stringify(settings));
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSFX(type) {
      if (!sfxEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      switch (type) {
        case 'coin':
          osc.type = 'square';
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
          break;
        case 'powerup':
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
          break;
        case 'click':
          osc.type = 'square';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
          break;
        case 'close':
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
          break;
      }
    }

    async function initGallery() {
      const gallery = document.getElementById('gallery');

      try {
        const repoRes = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}`);
        if (!repoRes.ok) throw new Error('REPO_NOT_FOUND');
        const repoData = await repoRes.json();
        const BRANCH = repoData.default_branch;

        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
        if (!res.ok) throw new Error('TREE_FETCH_FAILED');
        const data = await res.json();

        const imageFiles = data.tree.filter(item => 
          item.type === 'blob' && item.path.match(/\.(jpg|jpeg|png|webp|gif)$/i)
        );

        const categories = new Set(['All', 'FAVORITES', 'DESKTOP', 'MOBILE']);

        allWallpapers = imageFiles.map(file => {
          const parts = file.path.split('/');
          const filename = parts.pop();
          const category = parts.length > 0 ? parts[0] : 'Root';
          
          if (category !== 'Root') {
            categories.add(category);
          }

          const safePath = file.path.split('/').map(encodeURIComponent).join('/');
          const fullUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${safePath}`;
          const thumbUrl = `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=320&output=webp&q=65`;
          
          const smartName = generateSmartName(filename);

          return {
            rawName: filename,
            displayName: smartName,
            category: category,
            orientation: 'DESKTOP',
            vibeTag: '#RETRO_VIBE',
            width: 0,
            height: 0,
            url: fullUrl,
            thumbUrl: thumbUrl
          };
        });

        renderFilters(Array.from(categories));
        renderGallery();
        checkHashLink();

      } catch (err) {
        gallery.innerHTML = `<p style="color:var(--accent-color); text-align:center; grid-column: 1/-1;">[ERROR]: ${err.message}. VERIFY PUBLIC REPO STATUS.</p>`;
      }
    }

    function renderFilters(categories) {
      const filters = document.getElementById('filters');
      filters.innerHTML = categories.map((cat, idx) => `
        <button class="filter-btn ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">[${cat}]</button>
      `).join('');
    }

    function getFilteredList() {
      let list = [...allWallpapers];

      if (currentCategory === 'FAVORITES') {
        list = list.filter(w => favorites.includes(w.rawName));
      } else if (currentCategory === 'DESKTOP') {
        list = list.filter(w => w.orientation === 'DESKTOP');
      } else if (currentCategory === 'MOBILE') {
        list = list.filter(w => w.orientation === 'MOBILE');
      } else if (currentCategory !== 'All') {
        list = list.filter(w => w.category === currentCategory);
      }

      if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase();
        list = list.filter(w => 
          w.rawName.toLowerCase().includes(query) || 
          w.displayName.toLowerCase().includes(query) || 
          w.vibeTag.toLowerCase().includes(query) || 
          w.category.toLowerCase().includes(query)
        );
      }

      if (currentSort === 'az') list.sort((a, b) => a.displayName.localeCompare(b.displayName));
      if (currentSort === 'za') list.sort((a, b) => b.displayName.localeCompare(a.displayName));
      if (currentSort === 'random') list.sort(() => Math.random() - 0.5);

      return list;
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const filtered = getFilteredList();

      if (filtered.length === 0) {
        gallery.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">NO_FILES_FOUND.</p>`;
        return;
      }

      gallery.innerHTML = filtered.map(item => {
        const isFav = favorites.includes(item.rawName);
        const itemKey = item.rawName.replace(/[^a-zA-Z0-9]/g, '');
        const badgeText = item.width && item.height ? `${item.width}x${item.height}` : item.orientation;

        return `
          <div class="card">
            <div class="card-header">
              <span>SYS_IMG</span>
              <span>OK</span>
            </div>
            <div class="card-img-wrap" onclick="openModal('${item.url}', '${item.rawName}')">
              <span class="badge" id="badge-${itemKey}">${badgeText}</span>
              <span class="vibe-badge" id="vibe-${itemKey}">${item.vibeTag}</span>
              <img src="${item.thumbUrl}" alt="${item.displayName}" loading="lazy" crossorigin="anonymous" onload="handleThumbLoad(this, '${itemKey}', '${item.rawName}')">
            </div>
            <div class="card-footer">
              <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${item.rawName}', event)">${isFav ? '♥' : '♡'}</button>
              <span title="${item.rawName}">${item.displayName}</span>
              <button class="retro-btn" onclick="downloadImage('${item.url}', '${item.rawName}')">GET</button>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Fast aspect ratio & Color Vibe Detection */
    function handleThumbLoad(img, itemKey, rawName) {
      const item = allWallpapers.find(w => w.rawName === rawName);
      if (!item) return;

      const isLandscape = img.naturalWidth >= img.naturalHeight;
      item.orientation = isLandscape ? 'DESKTOP' : 'MOBILE';

      const detectedTag = detectColorVibe(img);
      item.vibeTag = detectedTag;

      const badge = document.getElementById(`badge-${itemKey}`);
      if (badge && (!item.width || !item.height)) {
        badge.innerText = item.orientation;
      }

      const vibeElem = document.getElementById(`vibe-${itemKey}`);
      if (vibeElem) {
        vibeElem.innerText = detectedTag;
      }
    }

    function toggleFav(rawName, event) {
      event.stopPropagation();
      playSFX('coin');
      if (favorites.includes(rawName)) {
        favorites = favorites.filter(f => f !== rawName);
      } else {
        favorites.push(rawName);
      }
      localStorage.setItem('vault_favs', JSON.stringify(favorites));
      renderGallery();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      renderGallery();
    }

    function filterCategory(category, btn) {
      playSFX('click');
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGallery();
    }

    function surpriseMe() {
      playSFX('powerup');
      if (allWallpapers.length === 0) return;
      const rand = allWallpapers[Math.floor(Math.random() * allWallpapers.length)];
      openModal(rand.url, rand.rawName);
    }

    function toggleScreensaver() {
      playSFX('powerup');
      const ss = document.getElementById('screensaverOverlay');
      screensaverActive = !screensaverActive;

      if (screensaverActive) {
        ss.classList.add('active');
        showNextScreensaverImage();
        screensaverTimer = setInterval(showNextScreensaverImage, 4500);
        window.addEventListener('keydown', handleScreensaverKey);
      } else {
        ss.classList.remove('active');
        clearInterval(screensaverTimer);
        window.removeEventListener('keydown', handleScreensaverKey);
      }
    }

    function showNextScreensaverImage() {
      if (allWallpapers.length === 0) return;
      const rand = allWallpapers[Math.floor(Math.random() * allWallpapers.length)];
      document.getElementById('screensaverImg').src = rand.url;
      const dims = rand.width && rand.height ? ` [${rand.width}x${rand.height}]` : '';
      document.getElementById('screensaverTitle').innerText = `${rand.displayName} ${rand.vibeTag}${dims}`;
    }

    function handleScreensaverKey(e) {
      if (screensaverActive) {
        toggleScreensaver();
      }
    }

    async function downloadImage(url, filename) {
      playSFX('click');
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
      }
    }

    function openModal(url, rawName) {
      playSFX('click');
      const item = allWallpapers.find(w => w.rawName === rawName);
      const displayName = item ? item.displayName : rawName;
      const vibe = item ? item.vibeTag : '';

      const modalImg = document.getElementById('modalImg');
      modalImg.src = url;
      document.getElementById('modalTitle').innerText = `${displayName} ${vibe}`;
      
      modalImg.onload = () => {
        if (item) {
          item.width = modalImg.naturalWidth;
          item.height = modalImg.naturalHeight;
          const itemKey = item.rawName.replace(/[^a-zA-Z0-9]/g, '');
          const badge = document.getElementById(`badge-${itemKey}`);
          if (badge) badge.innerText = `${item.width}x${item.height}`;
          document.getElementById('modalTitle').innerText = `${displayName} [${item.width}x${item.height}] ${vibe}`;
        }
      };

      const dlBtn = document.getElementById('modalDLBtn');
      dlBtn.onclick = () => downloadImage(url, rawName);
      
      document.getElementById('previewModal').classList.add('active');
      window.location.hash = `preview=${encodeURIComponent(rawName)}`;
    }

    function closeModal() {
      playSFX('close');
      document.getElementById('previewModal').classList.remove('active');
      history.replaceState(null, null, ' ');
    }

    function checkHashLink() {
      if (window.location.hash.startsWith('#preview=')) {
        const rawName = decodeURIComponent(window.location.hash.replace('#preview=', ''));
        const item = allWallpapers.find(w => w.rawName === rawName);
        if (item) openModal(item.url, item.rawName);
      }
    }

    function toggleCRT() {
      playSFX('click');
      const overlay = document.getElementById('crtOverlay');
      const btn = document.getElementById('crtBtn');
      overlay.classList.toggle('disabled');
      
      settings.crt = !overlay.classList.contains('disabled');
      btn.innerText = settings.crt ? '[CRT: ON]' : '[CRT: OFF]';
      saveSettings();
    }

    function toggleSFX() {
      sfxEnabled = !sfxEnabled;
      settings.sfx = sfxEnabled;
      if (sfxEnabled) {
        initAudio();
        playSFX('powerup');
      }
      document.getElementById('sfxBtn').innerText = sfxEnabled ? '[SFX: ON]' : '[SFX: OFF]';
      saveSettings();
    }

    function toggleDensity() {
      playSFX('click');
      const gallery = document.getElementById('gallery');
      const btn = document.getElementById('densityBtn');
      gallery.classList.toggle('compact');
      
      const isCompact = gallery.classList.contains('compact');
      settings.density = isCompact ? 'compact' : 'normal';
      btn.innerText = isCompact ? '[VIEW: 4X]' : '[VIEW: 2X]';
      saveSettings();
    }

    function changeSort(val) {
      playSFX('click');
      currentSort = val;
      renderGallery();
    }

    function changeTheme(themeName) {
      playSFX('click');
      document.body.className = themeName;
      settings.theme = themeName;
      saveSettings();
    }
    
    function copyShareLink() {
      playSFX('click');
      const shareUrl = window.location.href;
  
      navigator.clipboard.writeText(shareUrl).then(() => {
        const btn = document.getElementById('shareBtn');
        btn.innerText = '[COPIED!]';
        setTimeout(() => {
          btn.innerText = '[SHARE]';
        }, 1500);
      }).catch(err => {
        console.error('CLIPBOARD_ERROR: ', err);
      });
    }
    
    initSettings();
    initGallery();
  </script>
</body>
</html>
