<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WALLPAPER_VAULT.EXE</title>

  <!-- Favicon Tab Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">

  <!-- Retro Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0221;
      --main-color: #00ffcc;
      --accent-color: #ff007f;
      --card-bg: #190a38;
      --card-footer: #120529;
      --text-color: #00ffcc;
    }

    body.theme-matrix {
      --bg-color: #050b05;
      --main-color: #00ff66;
      --accent-color: #00ff66;
      --card-bg: #0a1a0a;
      --card-footer: #020a02;
      --text-color: #00ff66;
    }

    body.theme-amber {
      --bg-color: #0f0a00;
      --main-color: #ffb000;
      --accent-color: #ff8800;
      --card-bg: #1f1400;
      --card-footer: #0a0600;
      --text-color: #ffb000;
    }

    body.theme-gameboy {
      --bg-color: #8b956d;
      --main-color: #0f380f;
      --accent-color: #306230;
      --card-bg: #9bbc0f;
      --card-footer: #8b956d;
      --text-color: #0f380f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'VT323', monospace;
      padding: 1.5rem 1rem;
      font-size: 1.25rem;
      letter-spacing: 1px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* CRT Overlay */
    .crt-overlay {
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }
    .crt-overlay.disabled { display: none; }

    .container { max-width: 1300px; margin: 0 auto; }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.4rem;
      text-align: center;
      color: var(--accent-color);
      text-shadow: 3px 3px var(--main-color);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .retro-select, .retro-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--accent-color);
      outline: none;
    }

    .retro-btn:hover, .retro-select:hover {
      background: var(--accent-color);
      color: #fff;
      border-color: #fff;
    }

    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-bottom: 2rem; }
    .filter-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      background: var(--card-bg);
      color: var(--main-color);
      border: 2px solid var(--main-color);
      padding: 0.6rem 1rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--accent-color);
      transition: all 0.1s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: #fff;
      box-shadow: 3px 3px 0px var(--main-color);
      transform: translate(-1px, -1px);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      box-shadow: 4px 4px 0px var(--main-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-header {
      background: var(--accent-color);
      color: #ffffff;
      padding: 0.2rem 0.5rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-img-wrap {
      cursor: pointer;
      overflow: hidden;
      border-bottom: 2px solid var(--accent-color);
      height: 200px;
      background: #000;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .card:hover img { transform: scale(1.05); }

    .card-footer {
      padding: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-footer);
    }
    .card-footer span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 150px;
      color: var(--text-color);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 3px solid var(--main-color);
      box-shadow: 8px 8px 0px var(--accent-color);
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      background: var(--main-color);
      color: var(--bg-color);
      padding: 0.4rem 0.8rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-actions { display: flex; gap: 1rem; align-items: center; }
    .modal-btn {
      cursor: pointer;
      font-weight: bold;
      color: var(--accent-color);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
    }
    .modal-body img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="crt-overlay" id="crtOverlay"></div>

  <div class="container">
    <h1>> WALLPAPER_VAULT.EXE</h1>
    
    <div class="toolbar">
      <button class="retro-btn" onclick="toggleCRT()" id="crtBtn">[CRT: ON]</button>
      <select class="retro-select" onchange="changeTheme(this.value)">
        <option value="theme-synthwave">THEME: SYNTHWAVE</option>
        <option value="theme-matrix">THEME: MATRIX</option>
        <option value="theme-amber">THEME: AMBER</option>
        <option value="theme-gameboy">THEME: GAMEBOY</option>
      </select>
    </div>

    <div class="filters" id="filters"></div>
    <div class="gallery" id="gallery">LOADING_DATA...</div>
  </div>

  <div class="modal" id="previewModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalTitle">PREVIEW.BMP</span>
        <div class="modal-actions">
          <span class="modal-btn" id="modalDLBtn">[GET]</span>
          <span class="modal-btn" onclick="closeModal()">[X]</span>
        </div>
      </div>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Wallpaper Preview">
      </div>
    </div>
  </div>

  <script>
    const USERNAME = 'Dmsorn';
    const REPO = 'Wallpaper';

    let allWallpapers = [];

    async function initGallery() {
      const gallery = document.getElementById('gallery');

      try {
        const repoRes = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}`);
        if (!repoRes.ok) throw new Error('REPO_NOT_FOUND');
        const repoData = await repoRes.json();
        const BRANCH = repoData.default_branch;

        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
        if (!res.ok) throw new Error('TREE_FETCH_FAILED');
        const data = await res.json();

        const imageFiles = data.tree.filter(item => 
          item.type === 'blob' && item.path.match(/\.(jpg|jpeg|png|webp|gif)$/i)
        );

        const categories = new Set(['All']);

        allWallpapers = imageFiles.map(file => {
          const parts = file.path.split('/');
          const filename = parts.pop();
          const category = parts.length > 0 ? parts[0] : 'Root';
          
          categories.add(category);

          const safePath = file.path.split('/').map(encodeURIComponent).join('/');
          const fullUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${safePath}`;
          
          // Fast dynamic compression CDN
          const thumbUrl = `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=400&output=webp&q=75`;

          return {
            name: filename,
            category: category,
            url: fullUrl,
            thumbUrl: thumbUrl
          };
        });

        renderFilters(Array.from(categories));
        renderGallery('All');

      } catch (err) {
        gallery.innerHTML = `<p style="color:var(--accent-color); text-align:center; grid-column: 1/-1;">[ERROR]: ${err.message}. VERIFY PUBLIC REPO STATUS.</p>`;
      }
    }

    function renderFilters(categories) {
      const filters = document.getElementById('filters');
      filters.innerHTML = categories.map((cat, idx) => `
        <button class="filter-btn ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">[${cat}]</button>
      `).join('');
    }

    function renderGallery(category) {
      const gallery = document.getElementById('gallery');
      const filtered = category === 'All' ? allWallpapers : allWallpapers.filter(w => w.category === category);

      if (filtered.length === 0) {
        gallery.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">NO_FILES_FOUND.</p>`;
        return;
      }

      gallery.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-header">
            <span>SYS_IMG</span>
            <span>OK</span>
          </div>
          <div class="card-img-wrap" onclick="openModal('${item.url}', '${item.name}')">
            <img src="${item.thumbUrl}" alt="${item.name}" loading="lazy">
          </div>
          <div class="card-footer">
            <span>${item.name}</span>
            <button class="retro-btn" onclick="downloadImage('${item.url}', '${item.name}')">GET</button>
          </div>
        </div>
      `).join('');
    }

    async function downloadImage(url, filename) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
      }
    }

    function filterCategory(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGallery(category);
    }

    function openModal(url, title) {
      document.getElementById('modalImg').src = url;
      document.getElementById('modalTitle').innerText = title;
      
      const dlBtn = document.getElementById('modalDLBtn');
      dlBtn.onclick = () => downloadImage(url, title);
      
      document.getElementById('previewModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('previewModal').classList.remove('active');
    }

    function toggleCRT() {
      const overlay = document.getElementById('crtOverlay');
      const btn = document.getElementById('crtBtn');
      overlay.classList.toggle('disabled');
      btn.innerText = overlay.classList.contains('disabled') ? '[CRT: OFF]' : '[CRT: ON]';
    }

    function changeTheme(themeName) {
      document.body.className = themeName;
    }

    initGallery();
  </script>
</body>
</html>
