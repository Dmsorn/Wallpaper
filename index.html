<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WALLPAPER_VAULT.EXE</title>

  <!-- Retro Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #0d0221;
      color: #00ffcc;
      font-family: 'VT323', monospace;
      padding: 1.5rem 1rem;
      font-size: 1.25rem;
      letter-spacing: 1px;
    }

    /* CRT Scanline Overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .container { max-width: 1300px; margin: 0 auto; }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.4rem;
      text-align: center;
      color: #ff007f;
      text-shadow: 3px 3px #00ffcc;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    /* Retro Filter Buttons */
    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-bottom: 2rem; }
    .filter-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      background: #190a38;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 0.6rem 1rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #ff007f;
      transition: all 0.1s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #ff007f;
      color: #fff;
      border-color: #fff;
      box-shadow: 3px 3px 0px #00ffcc;
      transform: translate(-1px, -1px);
    }

    /* Gallery Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    /* Retro Window Cards */
    .card {
      background: #190a38;
      border: 2px solid #ff007f;
      box-shadow: 4px 4px 0px #00ffcc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-header {
      background: #ff007f;
      color: #ffffff;
      padding: 0.2rem 0.5rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-img-wrap {
      cursor: pointer;
      overflow: hidden;
      border-bottom: 2px solid #ff007f;
      height: 200px;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .card:hover img { transform: scale(1.05); }

    .card-footer {
      padding: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #120529;
    }
    .card-footer span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 150px;
      color: #00ffcc;
    }
    .card-footer a {
      color: #ff007f;
      text-decoration: none;
      font-weight: bold;
    }
    .card-footer a:hover { text-decoration: underline; color: #00ffcc; }

    /* Modal / Fullscreen Preview */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 2, 33, 0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #190a38;
      border: 3px solid #00ffcc;
      box-shadow: 8px 8px 0px #ff007f;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      background: #00ffcc;
      color: #0d0221;
      padding: 0.4rem 0.8rem;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      cursor: pointer;
      font-weight: bold;
      color: #ff007f;
    }
    .modal-body img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>> WALLPAPER_VAULT.EXE</h1>
    <div class="filters" id="filters"></div>
    <div class="gallery" id="gallery">LOADING_DATA...</div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalTitle">PREVIEW.BMP</span>
        <span class="modal-close" onclick="closeModal()">[X]</span>
      </div>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Wallpaper Preview">
      </div>
    </div>
  </div>

  <script>
    const USERNAME = 'Dmsorn';
    const REPO = 'Wallpaper';

    let allWallpapers = [];

    async function initGallery() {
      const gallery = document.getElementById('gallery');

      try {
        const repoRes = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}`);
        if (!repoRes.ok) throw new Error('REPO_NOT_FOUND');
        const repoData = await repoRes.json();
        const BRANCH = repoData.default_branch;

        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
        if (!res.ok) throw new Error('TREE_FETCH_FAILED');
        const data = await res.json();

        const imageFiles = data.tree.filter(item => 
          item.type === 'blob' && item.path.match(/\.(jpg|jpeg|png|webp|gif)$/i)
        );

        const categories = new Set(['All']);

        allWallpapers = imageFiles.map(file => {
          const parts = file.path.split('/');
          const category = parts.length > 1 ? parts[0] : 'Root';
          categories.add(category);

          const safePath = file.path.split('/').map(encodeURIComponent).join('/');
          const rawUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${safePath}`;

          return {
            name: parts[parts.length - 1],
            category: category,
            url: rawUrl
          };
        });

        renderFilters(Array.from(categories));
        renderGallery('All');

      } catch (err) {
        gallery.innerHTML = `<p style="color:#ff007f;">[ERROR]: ${err.message}. VERIFY PUBLIC REPO STATUS.</p>`;
      }
    }

    function renderFilters(categories) {
      const filters = document.getElementById('filters');
      filters.innerHTML = categories.map((cat, idx) => `
        <button class="filter-btn ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">[${cat}]</button>
      `).join('');
    }

    function renderGallery(category) {
      const gallery = document.getElementById('gallery');
      const filtered = category === 'All' ? allWallpapers : allWallpapers.filter(w => w.category === category);

      if (filtered.length === 0) {
        gallery.innerHTML = `<p>NO_FILES_FOUND.</p>`;
        return;
      }

      gallery.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-header">
            <span>SYS_IMG</span>
            <span>OK</span>
          </div>
          <div class="card-img-wrap" onclick="openModal('${item.url}', '${item.name}')">
            <img src="${item.url}" alt="${item.name}" loading="lazy">
          </div>
          <div class="card-footer">
            <span>${item.name}</span>
            <a href="${item.url}" target="_blank" download>GET</a>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGallery(category);
    }

    function openModal(url, title) {
      document.getElementById('modalImg').src = url;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('previewModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('previewModal').classList.remove('active');
    }

    initGallery();
  </script>
</body>
</html>
